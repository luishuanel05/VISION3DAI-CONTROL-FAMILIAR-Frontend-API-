<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8">
  <meta content="width=device-width,initial-scale=1" name="viewport">
  <title>
   Iniciar sesi&oacute;n &middot; VISION3DAI
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/base.css" rel="stylesheet">
 </head>
 <body>
  <a class="enlace-salto" href="#contenido">
   Saltar al contenido
  </a>
  <main class="container py-5" id="contenido">
   <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
     <section class="tarjeta p-4 p-md-5">
      <h1 class="h2">
       Iniciar sesi&oacute;n
      </h1>
      <p class="text-secondary">
       Accede a tu tablero familiar.
      </p>
      <div hidden id="estado">
      </div>
      <form>
       <div class="mb-3">
        <label class="form-label" for="correo">
         Correo
        </label>
        <input autocomplete="email" class="form-control" id="correo" name="correo" required type="email">
       </div>
       <div class="mb-3">
        <label class="form-label" for="clave">
         Contrase&ntilde;a
        </label>
        <input autocomplete="current-password" class="form-control" id="clave" name="clave" required type="password">
       </div>
       <button class="btn btn-success w-100">
        Entrar
       </button>
      </form>
      <p class="mt-3">
       &iquest;No tienes cuenta?
       <a href="/registro.html">
        Reg&iacute;strate
       </a>
      </p>
     </section>
    </div>
   </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="/assets/js/autenticacion.js" type="module">
  </script>
 </body>
</html>
