<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8">
  <meta content="width=device-width,initial-scale=1" name="viewport">
  <title>
   Registro r&aacute;pido &middot; VISION3DAI
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/base.css" rel="stylesheet">
 </head>
 <body>
  <a class="enlace-salto" href="#contenido">
   Saltar al contenido
  </a>
  <nav class="navbar navbar-expand-lg navbar-dark">
   <div class="container">
    <a class="navbar-brand marca" href="/dashboard.html">
     VISION3DAI
    </a>
    <button class="navbar-toggler" data-bs-target="#menu" data-bs-toggle="collapse">
     <span class="navbar-toggler-icon">
     </span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
     <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/dashboard.html">
       Dashboard
      </a>
      <a class="nav-link" href="/perfiles.html">
       Perfiles
      </a>
      <a class="nav-link" href="/registro-rapido.html">
       Registro r&aacute;pido
      </a>
      <a class="nav-link" href="/metas.html">
       Metas
      </a>
      <a class="nav-link" href="/calendario.html">
       Calendario
      </a>
      <button class="btn btn-outline-light ms-lg-3" id="salir">
       Cerrar sesi&oacute;n
      </button>
     </div>
    </div>
   </div>
  </nav>
  <main class="container py-5" id="contenido">
   <h1>
    Registro r&aacute;pido
   </h1>
   <div hidden id="estado">
   </div>
   <div class="row g-4">
    <div class="col-lg-4">
     <form class="tarjeta p-4" data-tipo="hidratacion">
      <h2 class="h4">
       Hidrataci&oacute;n
      </h2>
      <select class="form-select mb-3" name="perfilId">
      </select>
      <input class="form-control mb-3" min="1" name="cantidadMl" placeholder="Mililitros" required type="number">
      <button class="btn btn-success">
       Guardar agua
      </button>
     </form>
    </div>
    <div class="col-lg-4">
     <form class="tarjeta p-4" data-tipo="alimentacion">
      <h2 class="h4">
       Alimentaci&oacute;n
      </h2>
      <select class="form-select mb-3" name="perfilId">
      </select>
      <select class="form-select mb-3" name="tipo">
       <option>
        desayuno
       </option>
       <option>
        almuerzo
       </option>
       <option>
        merienda
       </option>
       <option>
        cena
       </option>
      </select>
      <input class="form-control mb-3" name="descripcion" placeholder="Descripci&oacute;n breve" required>
      <button class="btn btn-success">
       Guardar comida
      </button>
     </form>
    </div>
    <div class="col-lg-4">
     <form class="tarjeta p-4" data-tipo="actividades">
      <h2 class="h4">
       Actividad
      </h2>
      <select class="form-select mb-3" name="perfilId">
      </select>
      <input class="form-control mb-3" name="nombre" placeholder="Actividad" required>
      <input class="form-control mb-3" min="1" name="duracionMinutos" placeholder="Minutos" required type="number">
      <select class="form-select mb-3" name="ubicacion">
       <option>
        interior
       </option>
       <option>
        exterior
       </option>
      </select>
      <button class="btn btn-success">
       Guardar actividad
      </button>
     </form>
    </div>
   </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="/assets/js/registro-rapido.js" type="module">
  </script>
 </body>
</html>
