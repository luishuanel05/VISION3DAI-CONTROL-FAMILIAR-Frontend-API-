  <main class="container py-5" id="contenido">
   <h1>
    Metas
   </h1>
   <div hidden id="estado">
   </div>
   <div class="row g-4">
    <div class="col-lg-4">
     <form class="tarjeta p-4">
      <h2 class="h4">
       Nueva meta
      </h2>
      <input class="form-control mb-3" name="titulo" placeholder="T&iacute;tulo" required>
      <input class="form-control mb-3" name="categoria" placeholder="Categor&iacute;a" required>
      <div class="row">
       <div class="col">
        <input class="form-control mb-3" min="0.01" name="valorObjetivo" placeholder="Objetivo" required step="0.01" type="number">
       </div>
       <div class="col">
        <input class="form-control mb-3" name="unidad" placeholder="Unidad" required>
       </div>
      </div>
      <select class="form-select mb-3" name="tipo">
       <option>
        individual
       </option>
       <option>
        familiar
       </option>
      </select>
      <button class="btn btn-success">
       Crear meta
      </button>
     </form>
    </div>
    <div class="col-lg-8">
     <div class="row g-3" id="lista">
     </div>
    </div>
   </div>
