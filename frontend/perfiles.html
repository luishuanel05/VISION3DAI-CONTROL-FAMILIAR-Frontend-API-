<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8">
  <meta content="width=device-width,initial-scale=1" name="viewport">
  <title>
   Perfiles &middot; VISION3DAI
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/base.css" rel="stylesheet">
 </head>
 <body>
  <a class="enlace-salto" href="#contenido">
   Saltar al contenido
  </a>
  <nav class="navbar navbar-expand-lg navbar-dark">
   <div class="container">
    <a class="navbar-brand marca" href="/dashboard.html">
     VISION3DAI
    </a>
    <button class="navbar-toggler" data-bs-target="#menu" data-bs-toggle="collapse">
     <span class="navbar-toggler-icon">
     </span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
     <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/dashboard.html">
       Dashboard
      </a>
      <a class="nav-link" href="/perfiles.html">
       Perfiles
      </a>
      <a class="nav-link" href="/registro-rapido.html">
       Registro r&aacute;pido
      </a>
      <a class="nav-link" href="/metas.html">
       Metas
      </a>
      <a class="nav-link" href="/calendario.html">
       Calendario
      </a>
      <button class="btn btn-outline-light ms-lg-3" id="salir">
       Cerrar sesi&oacute;n
      </button>
     </div>
    </div>
   </div>
  </nav>
  <main class="container py-5" id="contenido">
   <h1>
    Perfiles familiares
   </h1>
   <div hidden id="estado">
   </div>
   <div class="row g-4">
    <div class="col-lg-4">
     <form class="tarjeta p-4">
      <h2 class="h4">
       Nuevo perfil
      </h2>
      <label class="form-label">
       Nombre
      </label>
      <input class="form-control mb-3" name="nombre" required>
      <label class="form-label">
       Alias
      </label>
      <input class="form-control mb-3" name="alias">
      <label class="form-label">
       Tipo
      </label>
      <select class="form-select mb-3" name="tipo">
       <option>
        integrante
       </option>
       <option>
        adulto
       </option>
       <option>
        infantil
       </option>
      </select>
      <label class="form-label">
       Color
      </label>
      <input class="form-control form-control-color mb-3" name="color" type="color" value="#198754">
      <button class="btn btn-success">
       Guardar perfil
      </button>
     </form>
    </div>
    <div class="col-lg-8">
     <div class="row g-3" id="lista">
     </div>
    </div>
   </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="/assets/js/perfiles.js" type="module">
  </script>
 </body>
</html>
