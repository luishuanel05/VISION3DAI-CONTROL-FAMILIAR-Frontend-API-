<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8">
  <meta content="width=device-width,initial-scale=1" name="viewport">
  <title>
   Registro &middot; VISION3DAI
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/base.css" rel="stylesheet">
 </head>
 <body>
  <a class="enlace-salto" href="#contenido">
   Saltar al contenido
  </a>
  <main class="container py-5" id="contenido">
   <div class="row justify-content-center">
    <div class="col-md-7">
     <section class="tarjeta p-4 p-md-5">
      <h1 class="h2">
       Crear cuenta
      </h1>
      <div hidden id="estado">
      </div>
      <form>
       <div class="row g-3">
        <div class="col-md-6">
         <label class="form-label" for="nombre">
          Nombre
         </label>
         <input class="form-control" id="nombre" name="nombre" required>
        </div>
        <div class="col-md-6">
         <label class="form-label" for="apellido">
          Apellido
         </label>
         <input class="form-control" id="apellido" name="apellido" required>
        </div>
        <div class="col-12">
         <label class="form-label" for="correo">
          Correo
         </label>
         <input class="form-control" id="correo" name="correo" required type="email">
        </div>
        <div class="col-md-6">
         <label class="form-label" for="clave">
          Contrase&ntilde;a
         </label>
         <input class="form-control" id="clave" minlength="8" name="clave" required type="password">
        </div>
        <div class="col-md-6">
         <label class="form-label" for="confirmacionClave">
          Confirmaci&oacute;n
         </label>
         <input class="form-control" id="confirmacionClave" minlength="8" name="confirmacionClave" required type="password">
        </div>
       </div>
       <button class="btn btn-success mt-4 w-100">
        Crear cuenta
       </button>
      </form>
      <p class="mt-3">
       <a href="/login.html">
        Volver al login
       </a>
      </p>
     </section>
    </div>
   </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="/assets/js/registro.js" type="module">
  </script>
 </body>
</html>
